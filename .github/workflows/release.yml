# Manual release (nightlies: nightly.yml): builds the game and the world viewer (meitou-viewer), self-contained, for Windows, Linux and macOS
# (tools/scripts/package-release.ps1; the Windows zip with NVIDIA DLSS/Streamline and AMD FidelityFX next to the exes, the Linux zip with NVIDIA's DLSS model and NGX client library and our FidelityFX build), tags the commit
# v<version> and publishes a GitHub release with one Meitou-<version>-<rid>.zip per runtime (docs/launcher.md), never a pre-release (only nightlies are) and never marked Latest
# (that is the newest full launcher release, launcher-release.yml).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.0 (empty: 0.0.<run number>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Checks the version and its changelog section, runs the quick tests; nothing is built or released if this fails.
  version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $v = $env:INPUT_VERSION.Trim().TrimStart('v')
          if (-not $v) { $v = "0.0.$env:RUN_NUMBER" }
          if ($v -notmatch '^[0-9A-Za-z.\-]+$') { throw "bad version '$v'" }
          if (git tag -l "v$v") { throw "tag v$v already exists" }
          # The version's CHANGELOG.md section (from its "## v<version>" heading to the next "## "): required.
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::IndexOf($lines, "## v$v")
          if ($start -lt 0) { throw "CHANGELOG.md has no '## v$v' section" }
          $end = $start + 1
          while ($end -lt $lines.Count -and -not $lines[$end].StartsWith('## ')) { $end++ }
          $section = if ($end -gt $start + 1) { ($lines[($start + 1)..($end - 1)] -join "`n").Trim() } else { '' }
          if (-not $section) { throw "CHANGELOG.md's '## v$v' section is empty" }
          Set-Content -Path "$env:RUNNER_TEMP/changes.md" -Value "## v$v`n`n$section" -Encoding utf8
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Quick tests
        run: dotnet test --filter "Category!=Slow&Category!=Bench" -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}/changes.md
          if-no-files-found: error

  # One zip per runtime. Unix zips are made on Unix so the execute bits survive; macOS ones on a Mac, which signs the binaries.
  package:
    needs: version
    strategy:
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-22.04 }
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The Linux zip builds AMD's FidelityFX library from source (tools/scripts/build-ffx-linux.sh).
      - name: FidelityFX build tools
        if: matrix.rid == 'linux-x64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build glslang-tools libvulkan-dev

      - name: Package
        shell: pwsh
        run: ./tools/scripts/package-release.ps1 -Version "${{ needs.version.outputs.version }}" -Rid ${{ matrix.rid }} -Output out -Cache "$env:RUNNER_TEMP/release-cache"

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.rid }}
          path: out/Meitou-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}

      - name: Tag and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $zips = @('win-x64', 'linux-x64', 'osx-x64', 'osx-arm64') | ForEach-Object { "out/Meitou-$env:VERSION-$_.zip" }
          foreach ($zip in $zips) { if (-not (Test-Path $zip)) { throw "$zip missing" } }
          $notes = (Get-Content -Raw "$env:RUNNER_TEMP/changes.md").Trim()
          $flags = @('--latest=false', '--generate-notes')
          # GitHub's generated notes (merged pull requests) start at the previous full release, not a launcher-v* tag in between
          # (docs/launcher.md), so they span its nightlies.
          $previous = git tag -l "v[0-9]*" --sort=-v:refname | Where-Object { $_ -notmatch '-nightly\.' } | Select-Object -First 1
          if ($previous) { $flags += @('--notes-start-tag', $previous) }
          gh release create "v$env:VERSION" @zips --target $env:GITHUB_SHA `
            --title "Meitou $env:VERSION" --notes $notes @flags

  # Every release becomes a benchmark target (bench/README.md).
  bench-target:
    needs: [version, release]
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/bench-target.yml
    with:
      tag: v${{ needs.version.outputs.version }}
