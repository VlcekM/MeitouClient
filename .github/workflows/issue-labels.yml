# Issue labels: keeps the labels in .github/labels.json on GitHub, and Claude Haiku 5.5 gives each new issue its area:<id> label.
name: Issue labels

on:
  push:
    branches: [master]
    paths:
      - ".github/labels.json"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node .github/scripts/sync-labels.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  area:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        working-directory: .github/scripts
      - name: Ask Claude Haiku 5.5 for the area
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY secret; skipped." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node .github/scripts/label-issue.mjs
