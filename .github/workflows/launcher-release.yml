# Manual launcher release: Velopack packages of launcher/Meitou.Launcher (one Native AOT executable each), one channel per runtime (win-x64, linux-x64, osx-x64,
# osx-arm64), each built on its own OS (macOS packages need a Mac), all attached to one launcher-v<version> release; a full one
# is marked Latest, so /releases/latest (the README's link) is always the newest launcher. The installed launcher updates itself from these (docs/launcher.md, "Self-update").
name: Launcher release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Launcher version without the v, e.g. 0.1.0"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: false
      build_only:
        description: "Upload packages as workflow artifacts without tagging or publishing a release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161 # must match the Velopack package in Meitou.Launcher.csproj
  VCPKG_COMMIT: 817892b0ecbc6af994dd6df999c73faf795adbf2 # libvpx 1.16.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          v="${INPUT_VERSION#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version '$v'"; exit 1; }
          if [ "$BUILD_ONLY" = true ]; then
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "Unreleased launcher build $v." > "$RUNNER_TEMP/changes.md"
            exit 0
          fi
          [ -z "$(git tag -l "launcher-v$v")" ] || { echo "tag launcher-v$v already exists"; exit 1; }
          # The version's launcher/CHANGELOG.md section (from "## v<version>" to the next "## "): required.
          awk -v h="## v$v" '$0==h{f=1;next} /^## /{f=0} f' launcher/CHANGELOG.md > "$RUNNER_TEMP/changes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/changes.md" || { echo "launcher/CHANGELOG.md has no non-empty '## v$v' section"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}/changes.md

  package:
    needs: version
    strategy:
      fail-fast: false # one platform failing must not hide the others' results
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, exe: meitou-launcher.exe, legacy: false, channel: win-x64 }
          - { rid: linux-x64, os: ubuntu-22.04, exe: meitou-launcher, legacy: false, channel: linux-x64 }
          - { rid: osx-x64, os: macos-latest, exe: meitou-launcher, legacy: false, channel: osx-x64 }
          - { rid: osx-arm64, os: macos-latest, exe: meitou-launcher, legacy: false, channel: osx-arm64 }
          - { rid: osx-x64, os: macos-latest, exe: meitou-launcher, legacy: true, channel: osx-x64-legacy }
          - { rid: osx-arm64, os: macos-latest, exe: meitou-launcher, legacy: true, channel: osx-arm64-legacy }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # When Microsoft's download server is down (actions/setup-dotnet#794, 2026-10-25), the runner's preinstalled SDK is used if it
      # satisfies global.json; the next step fails otherwise.
      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          dotnet-version: 11.0.x

      - name: macOS compatibility runtime
        if: matrix.legacy
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: .NET SDK
        shell: bash
        run: |
          [ "${{ steps.dotnet.outcome }}" = success ] || echo "setup-dotnet failed; trying the preinstalled SDKs: $(dotnet --list-sdks | tr '\n' ' ')"
          dotnet --version
          # Tools such as vpk find the runtime through DOTNET_ROOT, which setup-dotnet sets only when it installs.
          # (Windows finds it in Program Files without it, and would not read a Git Bash path.)
          [ "$RUNNER_OS" = Windows ] || echo "DOTNET_ROOT=$(dirname "$(realpath "$(command -v dotnet)")")" >> "$GITHUB_ENV"

      # Native AOT links with the platform's toolchain: clang and zlib on Linux (MSVC and Xcode are on the other runners).
      - name: AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev nasm

      # News videos: libvpx built from source by vcpkg (pinned), linked statically into the executable (Meitou.Launcher.csproj, VpxRoot).
      - name: libvpx cache
        id: vpx-cache
        uses: actions/cache@v4
        with:
          path: vpx-runtime
          key: vpx-${{ matrix.rid }}-${{ env.VCPKG_COMMIT }}-macos12

      - name: libvpx
        if: steps.vpx-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          case "$RID" in
            win-x64) triplet=x64-windows-static ;; linux-x64) triplet=x64-linux ;; osx-x64) triplet=x64-osx ;; osx-arm64) triplet=arm64-osx ;;
          esac
          [ "$RUNNER_OS" = macOS ] && brew install nasm
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          case "$RUNNER_OS" in Windows) "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics ;; *) "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics ;; esac
          # Build for a baseline shared by standard and legacy macOS packages, rather than the runner's version.
          MACOSX_DEPLOYMENT_TARGET=12.0 VCPKG_KEEP_ENV_VARS=MACOSX_DEPLOYMENT_TARGET "$RUNNER_TEMP/vcpkg/vcpkg" install "libvpx:$triplet"
          mkdir -p vpx-runtime && cp -R "$RUNNER_TEMP/vcpkg/installed/$triplet" "vpx-runtime/$triplet"

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RID: ${{ matrix.rid }}
          EXE: ${{ matrix.exe }}
          LEGACY_MAC: ${{ matrix.legacy }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          if [ "$LEGACY_MAC" = true ]; then bash tools/scripts/build-native-macos.sh "$RID"; fi
          # Without libvpx the publish still succeeds, with news videos left out: refuse that.
          find vpx-runtime -path "*/lib/*" \( -name vpx.lib -o -name libvpx.a \) 2>/dev/null | grep -q . || { echo "libvpx missing in vpx-runtime/"; exit 1; }
          dotnet tool install -g vpk --version "$VPK_VERSION"
          dotnet publish launcher/Meitou.Launcher -c Release -r "$RID" --self-contained -p:Version="$VERSION" -p:MeitouLegacyMac="$LEGACY_MAC" -o pub
          if [ "$LEGACY_MAC" = true ]; then cp "macos-runtime/$RID/LICENSE-OpenAL-Soft.txt" pub/; fi
          # No paid Developer ID: ad-hoc sign the macOS executable so its integrity can be checked. Gatekeeper still warns.
          case "$RID" in osx-*) codesign --force --deep --sign - pub/meitou-launcher ;; esac
          icon=()
          [ "$RID" = win-x64 ] && icon=(--icon assets/branding/meitou.ico)
          [ "$RID" = linux-x64 ] && icon=(--icon assets/branding/meitou-64.png)
          pack_id=MeitouLauncher
          pack_title="Meitou Launcher"
          if [ "$LEGACY_MAC" = true ]; then
            pack_id=MeitouLauncherLegacy
            pack_title="Meitou Launcher Legacy"
          fi
          vpk pack --packId "$pack_id" --packVersion "$VERSION" --packTitle "$pack_title" --packDir pub \
            --mainExe "$EXE" --channel "$CHANNEL" --outputDir "out/$CHANNEL" "${icon[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.channel }}
          path: out/${{ matrix.channel }}
          if-no-files-found: error

  release:
    if: ${{ !inputs.build_only }}
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}

      - name: Checksums
        run: |
          cd out
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          sed -i 's#  \./#  #' SHA256SUMS

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Every channel's files go on the one release, so their names must not clash.
          dupes=$(find out -type f -printf '%f\n' | sort | uniq -d)
          [ -z "$dupes" ] || { echo "files with the same name in two channels: $dupes"; exit 1; }
          {
            echo "## Launcher v$VERSION"; echo; cat "$RUNNER_TEMP/changes.md"; echo
            echo "## Download"; echo
            echo "- **Windows**: \`MeitouLauncher-win-x64-Setup.exe\` (or the Portable zip)."
            echo "- **Linux**: the \`linux-x64\` AppImage."
            echo "- **macOS**: the \`osx-arm64\` (Apple silicon) or \`osx-x64\` (Intel) package; not notarized yet, so Gatekeeper warns."
            echo "- **Legacy macOS 13**: \`MeitouLauncherLegacy-osx-arm64-legacy-Setup.pkg\` or \`MeitouLauncherLegacy-osx-x64-legacy-Setup.pkg\`; uses .NET 10."
            echo; echo "Verify every download against \`SHA256SUMS\`. Once installed, the launcher updates itself. You need Kenshi installed."
          } > "$RUNNER_TEMP/notes.md"
          flags=(--latest)
          [ "$PRERELEASE" = true ] && flags=(--prerelease --latest=false)
          previous=$(git tag -l "launcher-v*" --sort=-v:refname | head -n1)
          [ -n "$previous" ] && flags+=(--generate-notes --notes-start-tag "$previous")
          gh release create "launcher-v$VERSION" $(find out -type f) --target "$GITHUB_SHA" \
            --title "Meitou Launcher $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
