# Website image: builds site/ (Astro, served by nginx), pushes it to GHCR as ghcr.io/vlcekm/meitou-site, then calls the redeploy webhook.
# Runs on pushes to master that touch site/, bench/ (benchmark data) or this file, and on demand.
name: Site image

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "bench/**"
      - ".github/workflows/site-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vlcekm/meitou-site

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the roadmap history and the benchmark commit order are read from git

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # site/src/data/history.json: the roadmap's status counts and changes over time, for /roadmap and its feeds.
      - name: Roadmap history
        run: node site/scripts/history.mjs

      # site/public/bench/bench.json: the benchmark page's data, built from bench/data and the commit order on master; fails on invalid data.
      - name: Benchmark data
        run: python3 bench/tools/generate.py --out site/public/bench/bench.json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: site
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tells the server to pull the new image and redeploy. The URL carries a token, so it lives in a repository secret.
      - name: Redeploy
        env:
          REDEPLOY_WEBHOOK_URL: ${{ secrets.REDEPLOY_WEBHOOK_URL }}
        run: curl --fail --silent --show-error --max-time 60 -X POST "$REDEPLOY_WEBHOOK_URL"
