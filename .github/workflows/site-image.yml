# Website image: builds site/ (Astro, served by nginx), pushes it to GHCR as ghcr.io/vlcekm/meitou-site, then calls the redeploy webhook.
# Runs on pushes to master that touch site/ or this file, and on demand.
name: Site image

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/site-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/vlcekm/meitou-site

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: site
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tells the server to pull the new image and redeploy. The URL carries a token, so it lives in a repository secret.
      - name: Redeploy
        env:
          REDEPLOY_WEBHOOK_URL: ${{ secrets.REDEPLOY_WEBHOOK_URL }}
        run: curl --fail --silent --show-error --max-time 60 -X POST "$REDEPLOY_WEBHOOK_URL"
