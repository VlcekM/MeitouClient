name: Bug report
description: Something in Meitou behaves differently from Kenshi, or breaks.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for testing Meitou. A report with the version, platform and log.txt can usually be acted on; one without often cannot.
  - type: input
    id: version
    attributes:
      label: Meitou version
      description: The version the launcher shows, e.g. 0.15.0 or 0.14.2-nightly.20261024.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - "Windows"
        - "Linux (native)"
        - "Linux (Proton)"
        - "macOS (Apple silicon)"
        - "macOS (Intel)"
    validations:
      required: true
  - type: dropdown
    id: copy
    attributes:
      label: Kenshi copy
      options:
        - "Steam"
        - "GOG"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: modded
    attributes:
      label: Mods
      options:
        - "No mods"
        - "With mods (list them below)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: What the original game does
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: "1. Load a save with ...
2. ..."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: log.txt
      description: Drag log.txt from the game's folder (next to MeitouClient) here. It keeps the last runs, so it still holds the bad one.
    validations:
      required: true
