# How soft each ground texture is, for the marks feet and bodies leave (Meitou ground trails).
# texture file name without extension = softness, 0 (takes no mark) to 1 (takes it in full).
# A texture not listed falls back on its biome layer's footstep type: sand, mud and snow 1, dirt 0.45, the rest 0.
# texture:Type = softness sets it for the layers of that footstep type only (Sand, Grass, Concrete, Wood, Metal, Water, Mud, Snow, Dirt):
# one texture can be tar mud in one biome and hardened metal in another.
# texture = softness, relief also sets the share of its relief depth (parallax and displacement) the texture keeps, 1 when left out:
# for normal maps of fine noise, which the depth rule raises into spikes.
# A mod may ship a file of the same name in its folder; a file beside the executable is read last. Later lines win.

# Loose: sand, snow, ash, wet mud
Ashland-snow_DIF = 1, 0.15    # a nearly flat map of fine noise, tiled every 333 m: 68 cm deep by the rule
Ashland_AshNoise_DIF = 1, 0.2 # the Ashlands' slope layer: noise, 42 cm deep by the rule
Ashland_Ash_DIF = 1, 0        # its normal map is no surface in the frame the game lights it in: the height is leftovers
